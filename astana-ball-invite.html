<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101625">
  <title>Приглашение на Астана бал</title>
  <style>
    :root{--night:#101625;--gold:#e8c982;--cream:#f7f0df;--rose:#d8a6a0}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 35%,#28314a 0,#161e30 42%,var(--night) 78%);color:var(--cream);font-family:Georgia,'Times New Roman',serif;overflow-x:hidden}
    .stars,.stars:before,.stars:after{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(1px 1px at 20% 30%,#fff 99%,transparent),radial-gradient(1px 1px at 80% 20%,#e8c982 99%,transparent),radial-gradient(1px 1px at 60% 70%,#fff 99%,transparent),radial-gradient(1.5px 1.5px at 35% 85%,#e8c982 99%,transparent);background-size:260px 240px;animation:twinkle 5s ease-in-out infinite alternate;opacity:.5}
    .stars:before,.stars:after{content:"";inset:0;background-position:100px 90px;animation-duration:7s;opacity:.45}.stars:after{background-position:40px 130px;animation-duration:9s}
    @keyframes twinkle{to{opacity:.18;transform:translateY(-5px)}}
    main{position:relative;min-height:100vh;display:grid;place-items:center;padding:32px 18px}
    .glow{position:absolute;width:min(85vw,650px);height:min(85vw,650px);border-radius:50%;background:#e8c9820a;filter:blur(18px);animation:breathe 5s ease-in-out infinite alternate}
    @keyframes breathe{to{transform:scale(1.12);opacity:.55}}
    .card{position:relative;width:min(100%,570px);padding:clamp(28px,7vw,58px);text-align:center;border:1px solid #e8c98277;background:linear-gradient(145deg,#172034eF,#101625f2);box-shadow:0 0 70px #0008, inset 0 0 40px #e8c9820a;opacity:0;transform:translateY(18px) scale(.98);animation:arrive 1s .2s forwards}
    @keyframes arrive{to{opacity:1;transform:none}}
    .card:before,.card:after{content:"✦";position:absolute;color:var(--gold);font-size:15px}.card:before{top:14px;left:16px}.card:after{right:16px;bottom:14px}
    .eyebrow{color:var(--gold);font-size:.78rem;letter-spacing:.28em;text-transform:uppercase}
    h1{font-weight:400;font-size:clamp(2.5rem,9vw,4.5rem);line-height:1.03;margin:18px 0 10px;color:var(--cream)}
    .rule{width:76px;height:1px;background:var(--gold);margin:25px auto;position:relative}.rule:after{content:"✧";position:absolute;left:50%;top:50%;transform:translate(-50%,-55%);background:#182034;padding:0 9px;color:var(--gold);font-size:18px}
    .intro{font-size:1.12rem;line-height:1.8;color:#f4e9d3}
    .name{color:var(--gold);font-style:italic;font-size:1.35em}
    .details{margin:28px auto 30px;display:grid;gap:12px;color:#e5dac6;font-size:1.05rem}.details span{color:var(--gold);margin-right:8px}
    button{font:inherit;color:var(--night);background:linear-gradient(120deg,#f1d99e,#d7b66c);border:0;padding:14px 25px;cursor:pointer;letter-spacing:.04em;transition:transform .2s,filter .2s;box-shadow:0 7px 24px #0004}
    button:hover{transform:translateY(-2px);filter:brightness(1.08)}
    .answer{min-height:1.5em;margin:18px 0 0;color:var(--gold);font-style:italic;opacity:0;transition:opacity .4s}.answer.show{opacity:1}
    .foot{font-size:.8rem;color:#b9b1a3;margin-top:28px}
    .open{position:fixed;inset:0;z-index:4;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 42%,#28314a,#101625 75%);transition:opacity .8s,visibility .8s}
    .open.hidden{opacity:0;visibility:hidden;pointer-events:none}
    .envelope{width:min(78vw,330px);height:205px;position:relative;display:grid;place-items:center;border:1px solid #e8c98299;background:linear-gradient(145deg,#26324c,#151d30);box-shadow:0 20px 70px #0008;animation:float 3s ease-in-out infinite}
    @keyframes float{50%{transform:translateY(-9px)}}
    .envelope:before{content:"";position:absolute;inset:0;background:linear-gradient(140deg,transparent 49.5%,#e8c98244 50%,transparent 50.5%),linear-gradient(220deg,transparent 49.5%,#e8c98244 50%,transparent 50.5%);pointer-events:none}
    .seal{position:relative;border:1px solid var(--gold);color:var(--gold);border-radius:50%;width:54px;height:54px;display:grid;place-items:center;font-size:23px;background:#192237}
    .open button{position:absolute;top:calc(50% + 135px);background:transparent;border:1px solid var(--gold);color:var(--cream);box-shadow:none}
    .open button:hover{background:#e8c98218}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <div class="open" id="cover">
    <div class="envelope" aria-hidden="true"><div class="seal">✦</div></div>
    <button id="openBtn">Открыть приглашение</button>
  </div>
  <main>
    <div class="glow" aria-hidden="true"></div>
    <article class="card">
      <div class="eyebrow">Одно особенное приглашение</div>
      <h1>Astana<br>Ball</h1>
      <div class="rule"></div>
      <p class="intro"><span class="name">[Zhukaa Pukaaa]</span>,<br>мне очень хочется провести этот вечер рядом с тобой.<br>Будешь моей спутницей на Astana Ball?</p>
      <div class="details">
        <div><span>✧</span> 30 October · 19:00 </div>
        <div><span>✧</span>Обеещаю и гарантирую хорошое настроение)</div>
      </div>
      <button id="yesBtn">Да, конечно ✨</button>
      <p class="answer" id="answer" aria-live="polite"></p>
      <div class="foot">Pleeeaaasee Press Yes 🤍</div>
    </article>
  </main>
  <script>
    const cover = document.getElementById('cover');
    document.getElementById('openBtn').addEventListener('click', () => cover.classList.add('hidden'));
    document.getElementById('yesBtn').addEventListener('click', () => {
      const answer = document.getElementById('answer');
      answer.textContent = 'Ураа, Люблю тебя Жанм, а теперь выходи на коридор) ✨';
      answer.classList.add('show');
    });
  </script>
</body>
</html>
